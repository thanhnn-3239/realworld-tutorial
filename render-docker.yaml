databases:
  - name: realworld-demo-db
    plan: free
    region: singapore
    databaseName: realworld_demo
    user: realworld_demo_user

services:
  - type: web
    name: realworld-demo-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: .
    autoDeployTrigger: off
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: realworld-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_ENV
        value: production
