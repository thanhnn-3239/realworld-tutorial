name: realworld-tutorial

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${DATABASE_NAME:-realworld}
    ports:
      - 127.0.0.1:${DATABASE_PORT:-5432}:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    # MinIO restricted public pulls from Docker Hub (docker.io/minio/minio) — even a
    # previously-cached tag now fails a fresh `docker pull` with "pull access denied".
    # quay.io/minio/minio carries the same tags/digests and stays publicly pullable.
    image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - 127.0.0.1:${STORAGE_API_PORT:-9000}:9000
      - 127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.30.6
    environment:
      MP_ENABLE_CHAOS: 'true'
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      target: development
      args:
        HOST_USER_ID: ${HOST_USER_ID:-1000}
        HOST_GROUP_ID: ${HOST_GROUP_ID:-1000}
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${DATABASE_USERNAME:-root}:${DATABASE_PASSWORD:-secret}@postgres:5432/${DATABASE_NAME:-realworld}?schema=public
      STORAGE_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    init: true
    command:
      [
        'sh',
        '-c',
        'CI=true pnpm install --frozen-lockfile --prefer-offline && pnpm db:migrate:deploy && exec pnpm start:dev',
      ]
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:3000
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5m

  adminer:
    image: adminer:5.4.2
    profiles: [tools]
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
  minio:
  redis:
