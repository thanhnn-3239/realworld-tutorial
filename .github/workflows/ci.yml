name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.5.1
          runtime: node@22.22.3
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Check committed Prisma client is up to date
        run: git diff --exit-code -- src/generated/prisma
      - name: Lint
        run: pnpm lint:ci
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test --runInBand
      - name: Production build
        run: pnpm build
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: realworld_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d realworld_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/realworld_ci
      JWT_SECRET: ci-only-secret
      BCRYPT_SALT_ROUNDS: '4'
      NODE_ENV: test
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: realworld-ci
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://127.0.0.1:9000/realworld-ci
      STORAGE_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.5.1
          runtime: node@22.22.3
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      # Started as a step rather than a service container: the minio image needs
      # the `server /data` argument, and `services:` cannot override a command.
      # globalSetup creates the bucket, so no mc client is needed here.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$STORAGE_ACCESS_KEY \
            -e MINIO_ROOT_PASSWORD=$STORAGE_SECRET_KEY \
            minio/minio:RELEASE.2024-11-07T00-52-20Z server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is live"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become live within 60s" >&2
          docker logs minio >&2
          exit 1
      - name: E2E tests
        run: pnpm test:e2e --maxWorkers=2
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
  docker-image:
    name: docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --target production --tag realworld-api:ci .
      - name: Check production user and runtime files
        run: |
          test "$(docker run --rm --entrypoint node realworld-api:ci -p 'process.getuid()')" != "0"
          docker run --rm --entrypoint pnpm realworld-api:ci exec prisma --version
          docker run --rm --entrypoint sh realworld-api:ci -c \
            'test -d /app/dist && test -d /app/prisma/migrations && test ! -d /app/src && test ! -d /app/test && test ! -e /app/.env'
